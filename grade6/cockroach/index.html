<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D AR Viewer</title>

  <!-- Official, stable model-viewer engine -->
  <script type="module" src="https://unpkg.com"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .viewer-container {
      position: relative;
      width: 100vw;
      height: 85vh;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    .ar-btn {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background: #000;
      color: #fff;
      border-radius: 22px;
      font-size: 14px;
      border: none;
      cursor: pointer;
      z-index: 10;
    }

    .hint {
      text-align: center;
      font-size: 12px;
      color: #555;
      margin: 6px 0 10px;
    }
  </style>
</head>
<body>

<div class="viewer-container">

  <!-- Core Component with Autoplay and Scale parameters -->
  <model-viewer 
    id="viewer" 
    src="model.glb" 
    ar 
    ar-modes="webxr scene-viewer" 
    camera-controls 
    auto-rotate
    autoplay
    camera-orbit="auto auto auto"
    camera-target="0m 0m 0m"> 
  </model-viewer>

  <!-- Single, unified operational button -->
  <button class="ar-btn" id="arButton"> 
    View in AR 
  </button>

</div>

<div class="hint"> 
  Rotate with fingers • For AR, tap “View in AR”
</div>

<script>
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const arButton = document.getElementById('arButton');
  const viewer = document.getElementById('viewer');

  // Chrome Autoplay & Scale Frame Adjustments
  viewer.addEventListener('load', () => {
    viewer.zoom(0);

    const availableAnims = viewer.availableAnimations;
    if (availableAnims && availableAnims.length > 0) {
      viewer.animationName = availableAnims;
      viewer.play();
    }
  });

  // Fixed Native Execution Handler (Fixes Android Permissions Block)
  arButton.addEventListener('click', (event) => {
    // Prevent any browser action delays from breaking user-gesture tokenization
    event.preventDefault(); 
    
    if (isIOS) {
      // iOS Setup: Generates Quick Look Bridge on tap
      const anchor = document.createElement('a');
      anchor.setAttribute('rel', 'ar');
      anchor.setAttribute('href', 'model.usdz#allowsContentScaling=1');
      
      const dummyImg = document.createElement('img');
      anchor.appendChild(dummyImg);
      anchor.click();
    } else {
      // Android Setup: Immediate, synchronous invocation bypassing modern WebXR security locks
      viewer.activateAR();
    }
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D AR Viewer</title>

  <script type="module" src="https://unpkg.com"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .viewer-container {
      position: relative;
      width: 100vw;
      height: 85vh;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    /* Standard Button for Android / Desktop */
    .ar-btn {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background: #000;
      color: #fff;
      border-radius: 22px;
      font-size: 14px;
      border: none;
      cursor: pointer;
      z-index: 10;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .hint {
      text-align: center;
      font-size: 12px;
      color: #555;
      margin: 6px 0 10px;
    }
  </style>
</head>
<body>

<div class="viewer-container">
  
  <model-viewer
    id="viewer"
    src="model.glb"
    ar
    ar-modes="webxr scene-viewer"
    camera-controls
    auto-rotate
    autoplay
    camera-target="0m 0m 0m"
    min-camera-orbit="auto auto auto"
    max-camera-orbit="auto auto auto">
  </model-viewer>

  <!-- 
    FIX 1 (iOS Loading Fail): Hardcoded HTML anchor with rel="ar".
    Safari requires this exact markup format on page initialization to execute Quick Look instantly.
  -->
  <a id="iosArLink" rel="ar" href="model.usdz#allowsContentScaling=1" style="display: none;">
    <button class="ar-btn">View in AR</button>
  </a>

  <!-- Fallback Button for Android/WebXR devices -->
  <button class="ar-btn" id="androidArButton" style="display: none;">
    View in AR
  </button>
</div>

<div class="hint">
  Rotate with fingers • For AR, tap “View in AR”
</div>

<script>
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const iosArLink = document.getElementById('iosArLink');
  const androidArButton = document.getElementById('androidArButton');
  const viewer = document.getElementById('viewer');

  // Display the proper button depending on device OS architecture
  if (isIOS) {
    iosArLink.style.display = 'block';
  } else {
    androidArButton.style.display = 'block';
    androidArButton.addEventListener('click', () => {
      viewer.activateAR();
    });
  }

  // FIX 2 (Chrome Animation Fail): Programmatic track extraction 
  viewer.addEventListener('load', () => {
    // 1. Auto-center the framing bounding boxes
    viewer.zoom(0); 

    // 2. Fetch animations list and feed track 0 explicitly to Chrome's player engine
    const animations = viewer.availableAnimations;
    if (animations && animations.length > 0) {
      viewer.animationName = animations[0];
      viewer.play();
    }
  });
</script>

</body>
</html>

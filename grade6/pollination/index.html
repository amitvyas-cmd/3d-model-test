<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D AR Viewer</title>

  <script type="module" src="https://unpkg.com"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .viewer-container {
      position: relative;
      width: 100vw;
      height: 85vh;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    .ar-btn {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background: #000;
      color: #fff;
      border-radius: 22px;
      font-size: 14px;
      border: none;
      cursor: pointer;
      z-index: 10;
    }

    .hint {
      text-align: center;
      font-size: 12px;
      color: #555;
      margin: 6px 0 10px;
    }
  </style>
</head>
<body>

<div class="viewer-container">
  <!-- 
    Added "min-camera-orbit" and "max-camera-orbit" to restrict wild zoom behavior.
    Added "camera-target" to force the center pivot point to the middle of the object.
  -->
  <model-viewer
    id="viewer"
    src="model.glb"
    ar
    ar-modes="webxr scene-viewer"
    camera-controls
    auto-rotate
    autoplay
    camera-target="0m 0m 0m"
    min-camera-orbit="auto auto auto"
    max-camera-orbit="auto auto auto">
  </model-viewer>

  <button class="ar-btn" id="arButton">
    View in AR
  </button>
</div>

<div class="hint">
  Rotate with fingers • For AR, tap “View in AR”
</div>

<script>
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const arButton = document.getElementById('arButton');
  const viewer = document.getElementById('viewer');

  // Fix 1: Auto-Scale Desktop View on Load
  viewer.addEventListener('load', () => {
    // Resets the framing camera so the entire bounding box fits perfectly in Chrome
    viewer.zoom(0); 
  });

  arButton.addEventListener('click', () => {
    if (isIOS) {
      const anchor = document.createElement('a');
      anchor.setAttribute('rel', 'ar');
      
      // Fix 2: Auto-Scale Mobile AR View
      // "canonicalWebPageURL" improves tracking, but we append parameters to control sizing
      anchor.setAttribute('href', 'model.usdz#allowsContentScaling=1&checkoutTitle=My%20Model');
      
      const img = document.createElement('img');
      anchor.appendChild(img);
      
      anchor.click();
    } else {
      viewer.activateAR();
    }
  });
</script>

</body>
</html>

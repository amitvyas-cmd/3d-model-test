<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D AR Viewer</title>

  <!-- Load the official, stable model-viewer engine -->
  <script type="module" src="https://unpkg.com"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
    }

    .viewer-container {
      position: relative;
      width: 100vw;
      height: 85vh;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --progress-bar-color: #000;
    }

    /* Style the native, built-in AR button safely */
    #ar-button {
      background-color: #000;
      border-radius: 22px;
      padding: 12px 20px;
      color: #fff;
      border: none;
      font-size: 14px;
      cursor: pointer;
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
    }

    /* Hide the button automatically if the device doesn't support AR */
    model-viewer:not([ar-status="object-placement"]) #ar-button {
      display: none;
    }

    .hint {
      text-align: center;
      font-size: 12px;
      color: #555;
      margin: 6px 0 10px;
    }
  </style>
</head>
<body>

<div class="viewer-container">

  <!-- 
    1. src / ios-src: Points natively to your files.
    2. autoplay: Instructs desktop Chrome to instantly play the animation.
    3. ar-modes: Uses "quick-look" first for iOS, bypassing the 2-step preview.
    4. camera-orbit: Set to 'auto' so large models scale into view automatically.
  -->
  <model-viewer
    id="viewer"
    src="model.glb"
    ios-src="model.usdz#allowsContentScaling=1"
    ar
    ar-modes="quick-look webxr scene-viewer"
    camera-controls
    auto-rotate
    autoplay
    camera-orbit="auto auto auto"
    interpolation-decay="200">
    
    <!-- This is the natively managed button slot. No unsafe JS clicks required. -->
    <button slot="ar-button" id="ar-button">
      View in AR
    </button>

  </model-viewer>

</div>

<div class="hint">
  Rotate with fingers • For AR, tap “View in AR”
</div>

<script>
  const viewer = document.getElementById('viewer');

  // Solid, fail-safe Chrome animation & auto-scale enforcement
  viewer.addEventListener('load', () => {
    // Force native auto-framing calculation for oversized models
    viewer.zoom(0);

    // Safeguard Chrome animation track playback
    const names = viewer.availableAnimations;
    if (names && names.length > 0) {
      viewer.animationName = names[0];
      viewer.play();
    }
  });
</script>

</body>
</html>
